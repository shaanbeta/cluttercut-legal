<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClutterCut Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root { --paper:#F4F6F3; --card:#FBFCFA; --ink:#222926; --muted:#59635F; --brand:#3D7167; --track:#D8E0DC; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:'Nunito',system-ui,sans-serif; line-height:1.6; -webkit-text-size-adjust:100%; }
main { max-width:680px; margin:0 auto; padding:48px 16px 72px; }
.brand { font-weight:800; font-size:15px; letter-spacing:.02em; color:var(--brand); text-decoration:none; }
h1 { font-size:34px; line-height:1.15; margin:18px 0 6px; font-weight:800; }
.status { color:var(--muted); font-size:14px; margin:0 0 28px; }
section { background:var(--card); border:1px solid var(--track); border-radius:22px; padding:20px 22px; margin:0 0 14px; box-shadow:0 6px 18px rgba(61,48,32,.05); }
h2 { font-size:18px; margin:0 0 8px; font-weight:800; }
p { margin:0 0 10px; font-size:16px; }
p:last-child { margin-bottom:0; }
a { color:var(--brand); }
nav { display:flex; gap:18px; margin-top:28px; font-size:15px; font-weight:700; }
.links a { display:block; background:var(--card); border:1px solid var(--track); border-radius:20px; padding:18px 22px; margin:0 0 12px; text-decoration:none; color:var(--ink); font-weight:800; font-size:18px; }
.links span { display:block; color:var(--muted); font-weight:400; font-size:15px; }
footer { color:var(--muted); font-size:14px; margin-top:32px; }
</style>
</head>
<body><main>
<span class="brand">ClutterCut</span>
<h1>Legal</h1>
<p class="status">Cut the clutter. Keep what matters.</p>
<div class="links">
<a href="privacy/">Privacy Policy<span>What we store, what we don’t, and your choices.</span></a>
<a href="terms/">Terms of Service<span>The rules for using ClutterCut.</span></a>
</div>
<footer>ClutterCut is operated by Shaan Kumar, West Windsor, New Jersey, USA. Contact: <a href="mailto:clawzbotz@gmail.com">clawzbotz@gmail.com</a></footer>
</main></body>
</html>
